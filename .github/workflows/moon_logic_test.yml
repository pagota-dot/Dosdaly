name: Moon Logic Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-moon-logic:
    name: Test Moon Logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required package
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify required files
        run: |
          echo "Checking required files..."
          test -f "moon_bot.py" || (echo "ERROR: moon_bot.py not found" && exit 1)
          test -f "test_moon.py" || (echo "ERROR: test_moon.py not found" && exit 1)
          echo "Required files found."

      - name: Run Moon logic tests
        run: |
          printf '\n' | python test_moon.py
