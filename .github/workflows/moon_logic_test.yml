name: Moon Logic Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "เลือก Logic Test หรือส่ง Moon TEST Preview"
        required: true
        default: logic_test
        type: choice
        options:
          - logic_test
          - test_preview
  push:
    paths:
      - "moon_bot.py"
      - "test_moon.py"
      - ".github/workflows/gag2-moon.yml"
      - ".github/workflows/moon_logic_test.yml"

permissions:
  contents: read

env:
  MOON_BOT_FILE: moon_bot.py

jobs:
  test-moon-logic:
    name: Test Moon Logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          echo "Checking required files..."
          test -f "$MOON_BOT_FILE" || (echo "ERROR: $MOON_BOT_FILE not found" && exit 1)
          test -f "test_moon.py" || (echo "ERROR: test_moon.py not found" && exit 1)
          test -f ".github/workflows/gag2-moon.yml" || (echo "ERROR: production Moon workflow not found" && exit 1)
          grep -q 'BOT_FILENAME = "moon_bot.py"' test_moon.py || (echo "ERROR: test_moon.py targets the wrong bot file" && exit 1)

          if grep -En 'moon_bot\([0-9]+\)\.py' test_moon.py .github/workflows/gag2-moon.yml .github/workflows/moon_logic_test.yml; then
            echo "ERROR: stale numbered Moon bot filename found"
            exit 1
          fi

          echo "Required files found."

      - name: Compile Moon bot
        run: python -m py_compile "$MOON_BOT_FILE"

      - name: Run Moon logic tests
        run: python test_moon.py

  preview-moon-alert:
    name: Moon TEST Preview
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test_preview' }}
    needs: test-moon-logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TRIGGER_SOURCE: test_preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview-only imports
        run: python -m pip install --disable-pip-version-check requests selenium

      - name: Send read-only Moon TEST Preview
        run: python moon_bot.py
