name: Scheduler Heartbeat Test

on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Show trigger
        run: |
          echo "Heartbeat OK"
          echo "Event: ${{ github.event_name }}"
          date -u
