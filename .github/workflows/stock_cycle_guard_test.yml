name: Stock Cycle Guard Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-stock-cycle-guard:
    name: Offline Guard Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium

      - name: Verify files
        run: |
          test -f "bot.py" || (echo "ERROR: bot.py not found" && exit 1)
          test -f "test_stock_cycle_guard.py" || (echo "ERROR: test_stock_cycle_guard.py not found" && exit 1)

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Run offline Stock Cycle Guard test
        run: python test_stock_cycle_guard.py
