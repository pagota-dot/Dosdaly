name: Run Stock logic tests

on:
  workflow_dispatch:
  push:
    paths:
      - bot.py
      - test_stock_cycle_guard.py
      - .github/workflows/stock_logic_test.yml
  pull_request:
    paths:
      - bot.py
      - test_stock_cycle_guard.py
      - .github/workflows/stock_logic_test.yml

permissions:
  contents: read

jobs:
  stock-logic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Stock bot
        run: python -m py_compile bot.py test_stock_cycle_guard.py

      - name: Run offline Stock logic and UI tests
        run: python test_stock_cycle_guard.py
