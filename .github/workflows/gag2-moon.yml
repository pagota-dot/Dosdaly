name: GAG2 Moon FINAL Alert v7.0.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gag2-moon-alert
  cancel-in-progress: false

jobs:
  moon-alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A queued workflow_dispatch otherwise checks out the old dispatch
          # SHA and can miss the FINAL status pushed by the preceding run.
          ref: main
          fetch-depth: 0

      - name: Sync latest FINAL ledger before scan
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Check Gold/Rainbow/Mega Moon FINAL
        run: python moon_bot.py

      - name: Save moon state safely
        shell: bash
        run: |
          if git status --porcelain -- moon_state.json | grep -q .; then
            cp moon_state.json /tmp/gag2-moon-state.json
          else
            echo "Moon state unchanged."
            exit 0
          fi

          git config user.name "gag2-moon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4
          do
            echo "Moon state save attempt $attempt/4"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/gag2-moon-state.json moon_state.json
            git add moon_state.json

            if git diff --cached --quiet
            then
              echo "Moon state already saved."
              exit 0
            fi

            git commit -m "chore: update moon alert state [skip ci]"

            if git push origin HEAD:main
            then
              echo "Moon state saved successfully."
              exit 0
            fi

            echo "Push collision. Retrying..."
            sleep 3
          done

          echo "Could not save moon state after 4 attempts."
          exit 1
