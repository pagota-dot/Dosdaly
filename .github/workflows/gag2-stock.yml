name: GAG2 Reliability Discord Bot v6.1

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gag2-reliability-source-sync-bot
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Reliability check GAG2 and notify Discord
        run: python bot.py

      - name: Save reliability state
        shell: bash
        run: |
          if git diff --quiet -- state.json 2>/dev/null; then
            echo "State unchanged."
            exit 0
          fi

          git config user.name "gag2-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update reliability state [skip ci]"
          git push
